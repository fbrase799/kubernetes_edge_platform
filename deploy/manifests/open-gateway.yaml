apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-gateway
  namespace: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: open-gateway
    spec:
      containers:
        - name: open-gateway
          image: docker.io/library/edge-gateway:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            # The cloud profile leaves the admin listener off. Its simulator file
            # stays inactive until this hook turns the temperature simulator on.
            - name: OGW_PROFILE
              value: cloud
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    i=0
                    while [ "$i" -lt 60 ]; do
                      if curl -fsS -o /dev/null -X PUT http://127.0.0.1:8080/api/v1/support/sources/temperature-sim \
                        -H 'content-type: application/json' \
                        -d '{"state":"active","settings":{}}'; then
                        exit 0
                      fi
                      i=$((i + 1))
                      sleep 1
                    done
                    echo "temperature simulator did not activate" >&2
                    exit 1
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: open-gateway
  namespace: edge
spec:
  type: ClusterIP
  selector:
    app: open-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: open-gateway-host
  namespace: edge
spec:
  type: NodePort
  selector:
    app: open-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
