apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: edge
servers: 1
agents: 2
image: rancher/k3s:v1.32.2-k3s1
ports:
  - port: 127.0.0.1:30080:30080
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:8080:30081
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:6080:30082
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      - arg: --tls-san=host.docker.internal
        nodeFilters:
          - server:*
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  k3d:
    wait: true
    timeout: "180s"
